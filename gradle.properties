#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
kotlin.mpp.enableCInteropCommonization=true
#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true

#Android
android.useAndroidX=true

#Maven Publishing
GROUP=io.github.kdroidfilter
VERSION_NAME=1.0.0-beta-02
POM_INCEPTION_YEAR=2024
POM_URL=https://github.com/kdroidFilter/ComposeDesktopNativeWebiew
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/kdroidFilter/ComposeDesktopNativeWebiew
POM_SCM_CONNECTION=scm:git:git://github.com/kdroidFilter/ComposeDesktopNativeWebiew.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/kdroidFilter/ComposeDesktopNativeWebiew.git
POM_DEVELOPER_ID=kdroidFilter
POM_DEVELOPER_NAME=kdroidFilter
POM_DEVELOPER_URL=https://github.com/kdroidFilter

# AGP 9 refuses com.android.library / com.android.application alongside the Kotlin Multiplatform
# plugin and points at com.android.kotlin.multiplatform.library instead. That plugin's DSL has no
# externalNativeBuild, buildTypes, ndk or defaultConfig, so it cannot express this build (QuickJS is
# compiled from CMake per build type; the demo is an Android application, which the KMP plugin does
# not cover at all). These are AGP's own documented opt-outs for exactly that case.
android.builtInKotlin=false
android.newDsl=false
